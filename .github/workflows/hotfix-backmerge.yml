name: Back-Merge main to dev

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    steps:
      - name: Check if back-merge is needed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const base = 'dev'
            const head = `${owner}:main`

            // Check if main is ahead of dev
            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base,
              head: 'main',
            })

            const status = comparison.data.status
            core.info(`Comparison status: ${status}`)

            if (status === 'identical' || status === 'behind') {
              core.info(`No back-merge needed — main is ${status} relative to dev`)
              return
            }

            // Check if a back-merge PR already exists
            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base,
              head,
            })

            if (existing.length > 0) {
              core.info(`Back-merge PR already open: ${existing[0].html_url}`)
              return
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head: 'main',
              title: 'Back-merge main into dev',
              body: [
                'Automatic back-merge PR created after a push to `main`.',
                '',
                'Merge this PR when CI passes to keep `dev` in sync with `main`.',
              ].join('\n'),
            })

            core.info(`Created back-merge PR: ${pr.data.html_url}`)
